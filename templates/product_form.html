{% extends "base.html" %}
{% block title %}
  {{ "Edit Product" if action == "edit" else "Add Product" }} — Logistic Inventory
{% endblock %}

{% block content %}
<h1>{{ "✏️ Edit Product" if action == "edit" else "➕ Add Product" }}</h1>

<form method="POST">

  <table cellpadding="6">

    <tr>
      <td><label for="name">Name <span style="color:red">*</span></label></td>
      <td>
        <input id="name" type="text" name="name"
               value="{{ product.name or '' }}" required
               style="width:280px;">
      </td>
    </tr>

    <tr>
      <td><label for="sku">SKU <span style="color:red">*</span></label></td>
      <td>
        <input id="sku" type="text" name="sku"
               value="{{ product.sku or '' }}" required
               style="width:160px;"
               {% if action == "edit" %}title="Changing SKU may affect existing movements"{% endif %}>
      </td>
    </tr>

    <tr>
      <td><label for="category">Category <span style="color:red">*</span></label></td>
      <td>
        <input id="category" type="text" name="category"
               value="{{ product.category or '' }}" required
               style="width:200px;"
               placeholder="e.g. Equipment, Packaging, Safety">
      </td>
    </tr>

    <tr>
      <td><label for="quantity">Quantity <span style="color:red">*</span></label></td>
      <td>
        <input id="quantity" type="number" name="quantity" min="0"
               value="{{ product.quantity if product.quantity is not none else 0 }}"
               required style="width:100px;">
      </td>
    </tr>

    <tr>
      <td><label for="reorder_level">Reorder Level <span style="color:red">*</span></label></td>
      <td>
        <input id="reorder_level" type="number" name="reorder_level" min="0"
               value="{{ product.reorder_level if product.reorder_level is not none else 0 }}"
               required style="width:100px;">
      </td>
    </tr>

    <tr>
      <td><label for="price">Price (USD) <span style="color:red">*</span></label></td>
      <td>
        <input id="price" type="number" name="price" min="0" step="0.01"
               value="{{ product.price or '' }}" required
               style="width:120px;">
      </td>
    </tr>

    <tr>
      <td><label for="supplier">Supplier</label></td>
      <td>
        <input id="supplier" type="text" name="supplier"
               value="{{ product.supplier or '' }}" style="width:240px;">
      </td>
    </tr>

    <tr>
      <td><label for="location">Location</label></td>
      <td>
        <input id="location" type="text" name="location"
               value="{{ product.location or '' }}" style="width:240px;">
      </td>
    </tr>

  </table>

  <br>
  <button type="submit">
    {{ "💾 Update Product" if action == "edit" else "✅ Add Product" }}
  </button>
  &nbsp;
  <a href="{{ url_for('product_list') }}">Cancel</a>

</form>
{% endblock %}
